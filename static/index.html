<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PC Remote Control (WebRTC)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #111; color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  #login {
    margin: auto; padding: 24px; background: #1c1c1c; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; width: min(90vw, 340px);
  }
  #login h1 { font-size: 18px; margin: 0 0 4px; }
  input, button {
    padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
    background: #262626; color: #eee; font-size: 15px;
  }
  button { cursor: pointer; background: #2d6cdf; border: none; }
  button:hover { background: #3a78ea; }
  button:disabled { opacity: .5; cursor: default; }
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #toolbar {
    display: flex; gap: 8px; padding: 8px; background: #1a1a1a;
    align-items: center; flex-wrap: wrap;
  }
  #toolbar input[type=text] { flex: 1; min-width: 120px; }
  #screenWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #000; min-height: 0;
  }
  #screen {
    max-width: 100%; max-height: 100%; object-fit: contain;
    touch-action: none; cursor: crosshair;
    user-select: none; -webkit-user-select: none;
  }
  .small { font-size: 13px; color: #888; }
  .btn-sm { padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>

<div id="login">
  <h1>PC Remote Control · WebRTC</h1>
  <label class="small">접속 토큰을 입력하세요</label>
  <input id="token" type="password" placeholder="access token" autocomplete="off" />
  <button id="connectBtn">연결</button>
  <div id="loginErr" class="small" style="color:#e06;"></div>
</div>

<div id="app">
  <div id="toolbar">
    <button class="btn-sm" id="rightClickMode">우클릭: OFF</button>
    <input id="keyInput" type="text" placeholder="여기에 입력하면 PC로 전송 (Enter=엔터키)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button class="btn-sm" data-key="enter">Enter</button>
    <button class="btn-sm" data-key="backspace">⌫</button>
    <button class="btn-sm" data-hotkey="ctrl,c">Ctrl+C</button>
    <button class="btn-sm" data-hotkey="ctrl,v">Ctrl+V</button>
    <button class="btn-sm" data-key="esc">Esc</button>
    <button class="btn-sm" id="clipPull" title="PC 클립보드를 이 기기로 가져오기" hidden>📋 PC→여기</button>
    <button class="btn-sm" id="clipPush" title="이 기기 클립보드를 PC로 보내기" hidden>📋 여기→PC</button>
    <span id="status" class="small"></span>
  </div>
  <div id="screenWrap">
    <video id="screen" autoplay playsinline muted></video>
  </div>
</div>

<script>
let TOKEN = "";
let pc = null;
let dc = null;
const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $("status").textContent = t; };

function send(obj) {
  if (dc && dc.readyState === "open") {
    try { dc.send(JSON.stringify(obj)); } catch (e) {}
  }
}

// Map a pointer event on the <video> to normalized [0,1] coordinates,
// accounting for the letterboxing produced by object-fit: contain.
function normCoords(clientX, clientY, video) {
  const r = video.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return { x: 0, y: 0 };
  const scale = Math.min(r.width / vw, r.height / vh);
  const dispW = vw * scale, dispH = vh * scale;
  const offX = (r.width - dispW) / 2, offY = (r.height - dispH) / 2;
  const clamp = (v) => Math.min(Math.max(v, 0), 1);
  return {
    x: clamp((clientX - r.left - offX) / dispW),
    y: clamp((clientY - r.top - offY) / dispH),
  };
}

$("connectBtn").onclick = connect;

async function connect() {
  TOKEN = $("token").value.trim();
  if (!TOKEN) return;
  $("connectBtn").disabled = true;
  $("loginErr").textContent = "";

  let cfg;
  try {
    const res = await fetch("/config?token=" + encodeURIComponent(TOKEN));
    if (!res.ok) throw new Error("auth");
    cfg = await res.json();
  } catch (e) {
    $("loginErr").textContent = "토큰이 올바르지 않거나 서버에 연결할 수 없습니다.";
    $("connectBtn").disabled = false;
    return;
  }

  pc = new RTCPeerConnection({ iceServers: cfg.iceServers || [] });

  pc.addTransceiver("video", { direction: "recvonly" });
  dc = pc.createDataChannel("input", { ordered: true });

  pc.ontrack = (ev) => { $("screen").srcObject = ev.streams[0]; };
  pc.onconnectionstatechange = () => {
    setStatus("상태: " + pc.connectionState);
    if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      setStatus("연결 끊김 - 새로고침 후 다시 연결하세요");
    }
  };

  // Messages from the PC (e.g. clipboard contents pulled on request).
  dc.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === "clipboard") {
      navigator.clipboard.writeText(msg.text || "").then(
        () => setStatus("PC 클립보드를 가져왔습니다"),
        () => setStatus("클립보드 쓰기 실패 (브라우저 권한 필요)")
      );
    }
  };

  clipboardEnabled = !!cfg.clipboard;

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIceGathering(pc);

  const answerRes = await fetch("/offer?token=" + encodeURIComponent(TOKEN), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      sdp: pc.localDescription.sdp,
      type: pc.localDescription.type,
    }),
  });
  const answer = await answerRes.json();
  await pc.setRemoteDescription(answer);

  $("login").style.display = "none";
  $("app").style.display = "flex";
  setupControls($("screen"));
  setupClipboard();
}

// Wait until ICE candidates are gathered (or 3s elapse) so the offer we
// POST already carries candidates — simpler than trickling them separately.
function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { pc.removeEventListener("icegatheringstatechange", check); resolve(); };
    const check = () => { if (pc.iceGatheringState === "complete") done(); };
    pc.addEventListener("icegatheringstatechange", check);
    setTimeout(done, 3000);
  });
}

let rightClick = false;
let clipboardEnabled = false;
$("rightClickMode").onclick = () => {
  rightClick = !rightClick;
  $("rightClickMode").textContent = "우클릭: " + (rightClick ? "ON" : "OFF");
};

function setupClipboard() {
  const pull = $("clipPull"), push = $("clipPush");
  // Server must support clipboard AND the browser needs the async Clipboard API,
  // which is only available in a secure context (HTTPS or localhost).
  if (!clipboardEnabled || !navigator.clipboard) {
    if (clipboardEnabled && !navigator.clipboard) {
      setStatus("클립보드는 HTTPS(또는 localhost)에서만 동작합니다");
    }
    return;
  }
  pull.hidden = false;
  push.hidden = false;

  pull.onclick = () => send({ action: "clipboard_get" }); // reply arrives via dc.onmessage
  push.onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      send({ action: "clipboard_set", text });
      setStatus("이 기기 클립보드를 PC로 보냈습니다");
    } catch (e) {
      setStatus("클립보드 읽기 실패 (브라우저 권한 필요)");
    }
  };
}

function setupControls(video) {
  let dragging = false;
  const btn = () => (rightClick ? "right" : "left");

  const getXY = (ev) => {
    const t = ev.touches && ev.touches[0] ? ev.touches[0]
            : ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0] : ev;
    return normCoords(t.clientX, t.clientY, video);
  };

  const down = (ev) => {
    ev.preventDefault();
    dragging = true;
    send({ action: "mousedown", ...getXY(ev), button: btn() });
  };
  const move = (ev) => {
    if (ev.type === "mousemove" && !dragging) {
      send({ action: "move", ...getXY(ev) });
      return;
    }
    if (dragging) { ev.preventDefault(); send({ action: "move", ...getXY(ev) }); }
  };
  const up = (ev) => {
    if (!dragging) return;
    ev.preventDefault();
    dragging = false;
    send({ action: "mouseup", ...getXY(ev), button: btn() });
  };

  video.addEventListener("mousedown", down);
  video.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  video.addEventListener("touchstart", down, { passive: false });
  video.addEventListener("touchmove", move, { passive: false });
  video.addEventListener("touchend", up, { passive: false });

  video.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    send({ action: "scroll", dy: ev.deltaY > 0 ? -1 : 1 });
  }, { passive: false });

  video.addEventListener("contextmenu", (ev) => ev.preventDefault());

  const ki = $("keyInput");
  ki.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      if (ki.value) send({ action: "type", text: ki.value });
      send({ action: "key", key: "enter" });
      ki.value = "";
    } else if (ev.key === "Backspace" && ki.value === "") {
      send({ action: "key", key: "backspace" });
    }
  });
  ki.addEventListener("input", () => {
    if (ki.value) { send({ action: "type", text: ki.value }); ki.value = ""; }
  });

  document.querySelectorAll("[data-key]").forEach((b) => {
    b.onclick = () => send({ action: "key", key: b.dataset.key });
  });
  document.querySelectorAll("[data-hotkey]").forEach((b) => {
    b.onclick = () => send({ action: "key", keys: b.dataset.hotkey.split(",") });
  });
}
</script>
</body>
</html>

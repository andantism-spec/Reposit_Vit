# coturn 설정 (Docker 배포용)
# 아래 <...> 부분을 자신의 환경에 맞게 수정하세요.

# --- 네트워크 ---
listening-port=3478
tls-listening-port=5349

# 서버의 공인 IP. 클라우드 VM처럼 사설IP만 붙어 있으면 아래 형태로:
#   external-ip=<공인IP>/<사설IP>
external-ip=<PUBLIC_IP>

# 릴레이 미디어 포트 범위 (host 네트워크로 그대로 열림)
min-port=49152
max-port=65535

# --- 인증 ---
realm=<REALM>            # 예: turn.example.com (임의 문자열 가능)
lt-cred-mech
user=<TURN_USER>:<TURN_PASS>

# 시간제한 자격증명 방식을 쓰려면 위 user 줄 대신:
# use-auth-secret
# static-auth-secret=<LONG_RANDOM_SECRET>

# --- 보안 (사설망 릴레이 차단 = SSRF 방지) ---
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
no-tlsv1
no-tlsv1_1

# --- 로그 ---
# Docker에서는 stdout 로그가 보기 편합니다 (docker compose logs -f coturn)
log-file=stdout
simple-log

# --- TLS(선택) ---
# docker-compose.yml에서 인증서를 /certs로 마운트한 경우:
# cert=/certs/fullchain.pem
# pkey=/certs/privkey.pem
